name: PS5 Price Tracker

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config.json
        run: python create_config.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: price_history.json
          key: price-history
          restore-keys: price-history

      - name: Run tracker
        run: python ps5_tracker.py

      - name: Save price history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: price_history.json
          key: price-history-${{ github.run_id }}
